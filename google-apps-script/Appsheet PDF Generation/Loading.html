<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <title>OSEM Report</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7fb;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      color: #222;
    }

    .card {
      width: 515px;
      max-width: 90%;
      background: #ffffff;
      border-radius: 18px;
      padding: 45px 42px;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.10);
      text-align: center;
    }

    .brand {
      font-size: 27px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111;
    }

    .title {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 18px;
      color: #444;
    }

    .resident {
      font-size: 14px;
      color: #777;
      min-height: 20px;
      margin-bottom: 25px;
    }

    /* ========================================= */
    /* SPINNER */
    /* ========================================= */

    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 22px;
      border: 5px solid #eeeeee;
      border-top: 5px solid #e53935;
      border-radius: 50%;
      animation:
        spin 0.9s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* ========================================= */
    /* STATUS */
    /* ========================================= */

    .status {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #333;
      min-height: 22px;
    }

    /* ========================================= */
    /* PROGRESS BAR */
    /* ========================================= */

    .progress-container {
      width: 100%;
      height: 10px;
      background: #eeeeee;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress {
      width: 0%;
      height: 100%;
      background:
        linear-gradient(
          90deg,
          #e53935,
          #ff8c00
        );
      border-radius: 10px;
      transition:
        width 0.4s ease;
    }

    .percentage {
      font-size: 13px;
      color: #777;
      margin-top: 9px;
    }

    /* ========================================= */
    /* MESSAGE */
    /* ========================================= */

    .message {
      margin-top: 27px;
      font-size: 13px;
      line-height: 1.6;
      color: #888;
    }

    /* ========================================= */
    /* READY SCREEN */
    /* ========================================= */

    .ready {
      display: none;
    }

    .ready-icon {
      width: 58px;
      height: 58px;
      margin: 10px auto 18px;
      border-radius: 50%;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 35px;
      line-height: 58px;
      font-weight: bold;
    }

    /* ========================================= */
    /* OPEN PDF BUTTON */
    /* ========================================= */

    .open-button {
      display: inline-block;
      margin-top: 24px;
      padding: 13px 30px;
      background: #e53935;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .open-button:hover {
      background: #c62828;
    }

    /* ========================================= */
    /* ERROR MESSAGE */
    /* ========================================= */

    .error {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #fff1f2;
      border-radius: 10px;
      color: #c62828;
      text-align: left;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .retry {
      display: none;
      margin-top: 18px;
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .retry:hover {
      background: #555;
    }

  </style>

</head>

<body>

<div class="card">

  <!-- ========================================= -->
  <!-- GENERATING SCREEN -->
  <!-- ========================================= -->

  <div id="generating">

    <div class="brand">
      OSEM
    </div>

    <div
      class="title"
      id="reportTitle">
      Report
    </div>

    <div
      class="resident"
      id="residentText">
    </div>

    <div
      class="spinner"
      id="spinner">
    </div>

    <div
      class="status"
      id="status">
      Starting...
    </div>

    <div class="progress-container">
      <div
        class="progress"
        id="progress">
      </div>
    </div>

    <div
      class="percentage"
      id="percentage">
      5%
    </div>

    <div
      class="message"
      id="generatingMessage">
      Please wait while the report is being prepared.
    </div>

  </div>

  <!-- ========================================= -->
  <!-- READY SCREEN -->
  <!-- ========================================= -->

  <div
    id="ready"
    class="ready">

    <div class="brand">
      OSEM
    </div>

    <div
      class="title"
      id="readyTitle">
      Report
    </div>

    <div
      class="resident"
      id="readyResident">
    </div>

    <div class="ready-icon">
      ✓
    </div>

    <div class="status">
      PDF Ready
    </div>

    <div class="progress-container">
      <div
        class="progress"
        style="width:100%">
      </div>
    </div>

    <div class="percentage">
      100%
    </div>

    <div
      class="message"
      id="readyMessage">

      Your report has been generated successfully.

      <br>

      Click below to open the PDF.

    </div>

    <a
      id="openPdf"
      class="open-button"
      href="#"
      target="_blank">

      OPEN PDF

    </a>

  </div>

  <!-- ========================================= -->
  <!-- ERROR MESSAGE -->
  <!-- ========================================= -->

  <div
    id="errorBox"
    class="error">
  </div>

  <button
    id="retryButton"
    class="retry"
    onclick="retryGeneration()">

    Try Again

  </button>

</div>

<script>

//====================================================
// PARAMETERS PASSED FROM doGet()
//====================================================

const residentID =
  "<?= residentID ?>";

const year =
  "<?= year ?>";

const month =
  "<?= month ?>";

const executionId =
  "<?= executionId ?>";

const action =
  "<?= action ?>";

const branch =
  "<?= branch ?>";

// IMPORTANT:
// This title comes directly from Apps Script
// getReportTitle(action).

const serverReportTitle =
  "<?= reportTitle ?>";


//====================================================
// REPORT CONFIGURATION
//====================================================

const REPORT_CONFIG = {

  chart: {

    title:
      "Medication Preparation Chart",

    generating:
      "Preparing medication chart...",

    waiting:
      "Please wait while the medication chart is being prepared.",

    success:
      "Your medication chart has been generated successfully."

  },

  purchase: {

    title:
      "Medication Purchase List",

    generating:
      "Preparing medication purchase list...",

    waiting:
      "Please wait while the medication purchase list is being prepared.",

    success:
      "Your medication purchase list has been generated successfully."

  },

  family: {

    title:
      "Family Medication Reminder",

    generating:
      "Preparing family medication reminder...",

    waiting:
      "Please wait while the family medication reminder is being prepared.",

    success:
      "Your family medication reminder has been generated successfully."

  },

  familyrequest: {

    title:
      "Family Medication Reminder",

    generating:
      "Preparing family medication reminder...",

    waiting:
      "Please wait while the family medication reminder is being prepared.",

    success:
      "Your family medication reminder has been generated successfully."

  },

  branchchart: {

    title:
      "Branch Medication Preparation Chart",

    generating:
      "Preparing branch medication charts...",

    waiting:
      "Please wait while the branch medication charts are being prepared.",

    success:
      "Your branch medication charts have been generated successfully."

  },

  familyconsumable: {

    title:
      "Family Consumable Reminder",

    generating:
      "Preparing family consumable reminder...",

    waiting:
      "Please wait while the family consumable reminder is being prepared.",

    success:
      "Your family consumable reminder has been generated successfully."

  },

  medsummary: {

    title:
      "Resident Medication Stock Summary List",

    generating:
      "Preparing resident medication stock summary...",

    waiting:
      "Please wait while the medication stock summary is being prepared.",

    success:
      "Your medication stock summary has been generated successfully."

  }

};


//====================================================
// FALLBACK CONFIG
//====================================================

const reportConfig =
  REPORT_CONFIG[action] ||
  {

    title:
      serverReportTitle ||
      "Report",

    generating:
      "Preparing report...",

    waiting:
      "Please wait while the report is being prepared.",

    success:
      "Your report has been generated successfully."

  };


//====================================================
// INITIALISE PAGE
//====================================================

function initialiseUI(){

  const title =
    serverReportTitle ||
    reportConfig.title ||
    "Report";

  document
    .getElementById("reportTitle")
    .innerText =
      title;

  document
    .getElementById("readyTitle")
    .innerText =
      title;

  document
    .getElementById("status")
    .innerText =
      reportConfig.generating;

  document
    .getElementById("generatingMessage")
    .innerText =
      reportConfig.waiting;

  document
    .getElementById("residentText")
    .innerText =
      "";

}


//====================================================
// CLIENT-SIDE GENERATION STATE
//====================================================

let pollTimer = null;

let generationFinished = false;

let generationFailed = false;

let generationRequestStarted = false;

let branchBatchTimer = null;


//====================================================
// STOP PROGRESS POLLING
//====================================================

function stopProgressPolling(){

  if(
    pollTimer !== null
  ){

    clearTimeout(
      pollTimer
    );

    pollTimer =
      null;

  }

}


//====================================================
// STOP BRANCH BATCH LOOP
//====================================================

function stopBranchBatchLoop(){

  if(
    branchBatchTimer !== null
  ){

    clearTimeout(
      branchBatchTimer
    );

    branchBatchTimer =
      null;

  }

}


//====================================================
// SCHEDULE NEXT BRANCH BATCH
//====================================================

function scheduleNextBranchBatch(){

  if(
    generationFinished ||
    generationFailed
  ){

    return;

  }

  if(
    branchBatchTimer !== null
  ){

    clearTimeout(
      branchBatchTimer
    );

  }

  branchBatchTimer =
    setTimeout(

      function(){

        branchBatchTimer =
          null;

        runNextBranchBatch();

      },

      700

    );

}


//====================================================
// RUN NEXT BRANCH BATCH
//====================================================

function runNextBranchBatch(){

  if(
    generationFinished ||
    generationFailed
  ){

    return;

  }

  google.script.run

    .withSuccessHandler(

      function(result){

        console.log(
          "Branch batch:",
          result
        );

        if(
          generationFinished ||
          generationFailed
        ){

          return;

        }

        //------------------------------------------------
        // More residents remain.
        //------------------------------------------------

        if(
          result &&
          result.async === true
        ){

          updateProgressContext(
            result
          );

          scheduleNextBranchBatch();

          return;

        }

        //------------------------------------------------
        // Final PDF returned.
        //------------------------------------------------

        if(
          result &&
          result.success === true &&
          result.pdfUrl
        ){

          generationFinished =
            true;

          stopBranchBatchLoop();
          stopProgressPolling();

          showReady(
            result
          );

          return;

        }

        //------------------------------------------------
        // Unexpected result.
        //------------------------------------------------

        generationFailed =
          true;

        stopBranchBatchLoop();
        stopProgressPolling();

        showError(
          result &&
          result.message
            ? result.message
            : "The branch chart generation did not return a PDF."
        );

      }

    )

    .withFailureHandler(

      function(error){

        console.error(
          "Branch batch error:",
          error
        );

        generationFailed =
          true;

        stopBranchBatchLoop();
        stopProgressPolling();

        showError(
          error &&
          error.message
            ? error.message
            : String(error)
        );

      }

    )

    .generateReportForWeb(

      action,
      residentID,
      branch,
      Number(year),
      Number(month),
      executionId

    );

}


//====================================================
// START GENERATION
//====================================================

function startGeneration(){

  //--------------------------------------------------
  // Prevent duplicate generation requests
  //--------------------------------------------------

  if(
    generationRequestStarted
  ){

    return;

  }

  generationRequestStarted =
    true;

  generationFinished =
    false;

  generationFailed =
    false;

  //--------------------------------------------------
  // BRANCH CHART
  //
  // The branch report is now resumable.
  //
  // IMPORTANT:
  // Do NOT make one long google.script.run request.
  // Each batch is a separate Apps Script execution.
  //--------------------------------------------------

  if(
    action === "branchchart"
  ){

    pollProgress();

    runNextBranchBatch();

    return;

  }

  //--------------------------------------------------
  // Existing synchronous reports
  //--------------------------------------------------

  pollProgress();

  google.script.run

    .withSuccessHandler(

      function(result){

        console.log(
          "Generation completed:",
          result
        );

        //------------------------------------------------
        // The actual generation request has returned.
        //------------------------------------------------

        if(
          result &&
          result.success === true &&
          result.pdfUrl
        ){

          generationFinished =
            true;

          stopProgressPolling();

          showReady(
            result
          );

          return;

        }

        //------------------------------------------------
        // Returned without usable PDF.
        //------------------------------------------------

        generationFailed =
          true;

        stopProgressPolling();

        showError(

          result &&
          result.message

            ? result.message

            : "The report generation completed without returning a PDF."

        );

      }

    )

    .withFailureHandler(

      function(error){

        console.error(
          "Generation error:",
          error
        );

        generationFailed =
          true;

        stopProgressPolling();

        showError(

          error &&
          error.message

            ? error.message

            : String(error)

        );

      }

    )

    .generateReportForWeb(

      action,
      residentID,
      branch,
      Number(year),
      Number(month),
      executionId

    );

}


//====================================================
// POLL PROGRESS
//====================================================

function pollProgress(){

  if(
    generationFinished ||
    generationFailed
  ){

    return;

  }

  if(
    !executionId
  ){

    scheduleNextPoll();

    return;

  }

  google.script.run

    .withSuccessHandler(

      function(progress){

        if(
          generationFinished ||
          generationFailed
        ){

          return;

        }

        console.log(
          "Progress:",
          progress
        );

        if(
          !progress
        ){

          scheduleNextPoll();

          return;

        }

        updateProgressContext(
          progress
        );

        if(
          typeof progress.percent ===
          "number"
        ){

          const safePercent =
            Math.round(

              Math.max(
                0,
                Math.min(
                  100,
                  progress.percent
                )
              )

            );

          document
            .getElementById("progress")
            .style.width =
              safePercent + "%";

          document
            .getElementById("percentage")
            .innerText =
              safePercent + "%";

        }

        if(
          progress.message
        ){

          document
            .getElementById("status")
            .innerText =
              progress.message;

        }

        //------------------------------------------------
        // Completed from cache
        //------------------------------------------------

        if(
          progress.status ===
          "completed"
        ){

          if(
            progress.pdfUrl
          ){

            generationFinished =
              true;

            stopProgressPolling();
            stopBranchBatchLoop();

            showReady(
              progress
            );

            return;

          }

          scheduleNextPoll();

          return;

        }

        //------------------------------------------------
        // Error from cache
        //------------------------------------------------

        if(
          progress.status ===
          "error"
        ){

          generationFailed =
            true;

          stopProgressPolling();
          stopBranchBatchLoop();

          showError(
            progress.message
          );

          return;

        }

        //------------------------------------------------
        // Continue
        //------------------------------------------------

        scheduleNextPoll();

      }

    )

    .withFailureHandler(

      function(error){

        //------------------------------------------------
        // Poll failure itself does NOT fail generation.
        //------------------------------------------------

        console.warn(
          "Progress polling temporarily failed:",
          error
        );

        if(
          !generationFinished &&
          !generationFailed
        ){

          scheduleNextPoll();

        }

      }

    )

    .getGenerationProgress(
      executionId
    );

}


//====================================================
// SCHEDULE NEXT PROGRESS POLL
//====================================================

function scheduleNextPoll(){

  if(
    pollTimer !== null
  ){

    clearTimeout(
      pollTimer
    );

  }

  if(
    generationFinished ||
    generationFailed
  ){

    pollTimer =
      null;

    return;

  }

  pollTimer =
    setTimeout(

      function(){

        pollTimer =
          null;

        pollProgress();

      },

      3000

    );

}


//====================================================
// UPDATE PROGRESS CONTEXT
//====================================================

function updateProgressContext(
  progress
){

  const residentText =
    document.getElementById(
      "residentText"
    );

  //--------------------------------------------------
  // BRANCH CHART
  //--------------------------------------------------

  if(
    action === "branchchart"
  ){

    const residentNumber =
      Number(
        progress.residentNumber
      );

    const totalResidents =
      Number(
        progress.totalResidents
      );

    if(
      residentNumber > 0 &&
      totalResidents > 0
    ){

      residentText.innerText =

        "Resident " +
        residentNumber +
        " of " +
        totalResidents;

    }
    else{

      residentText.innerText =
        "";

    }

    return;

  }

  //--------------------------------------------------
  // RESIDENT-SPECIFIC REPORTS
  //--------------------------------------------------

  if(
    progress.residentName
  ){

    residentText.innerText =
      progress.residentName;

    return;

  }

  //--------------------------------------------------
  // OTHER REPORTS
  //--------------------------------------------------

  residentText.innerText =
    "";

}


//====================================================
// SHOW READY SCREEN
//====================================================

function showReady(
  progress
){

  generationFinished =
    true;

  generationFailed =
    false;

  stopProgressPolling();
  stopBranchBatchLoop();

  document
    .getElementById("progress")
    .style.width =
      "100%";

  document
    .getElementById("percentage")
    .innerText =
      "100%";

  document
    .getElementById("generating")
    .style.display =
      "none";

  document
    .getElementById("ready")
    .style.display =
      "block";

  document
    .getElementById("readyTitle")
    .innerText =
      serverReportTitle ||
      reportConfig.title ||
      "Report";

  document
    .getElementById("readyMessage")
    .innerHTML =

      reportConfig.success +

      "<br>" +

      "Click below to open the PDF.";

  const readyResident =
    document.getElementById(
      "readyResident"
    );

  //--------------------------------------------------
  // BRANCH CHART
  //--------------------------------------------------

  if(
    action === "branchchart"
  ){

    readyResident.innerText =
      "Branch Medication Chart";

  }

  //--------------------------------------------------
  // RESIDENT-SPECIFIC REPORT
  //--------------------------------------------------

  else if(
    progress &&
    progress.residentName
  ){

    readyResident.innerText =
      progress.residentName;

  }

  //--------------------------------------------------
  // GENERIC REPORT
  //--------------------------------------------------

  else{

    readyResident.innerText =
      "";

  }

  const pdfButton =
    document.getElementById(
      "openPdf"
    );

  if(
    progress &&
    progress.pdfUrl
  ){

    pdfButton.href =
      progress.pdfUrl;

    pdfButton.style.display =
      "inline-block";

  }
  else{

    pdfButton.href =
      "#";

    pdfButton.style.display =
      "none";

  }

  //--------------------------------------------------
  // Try opening PDF automatically
  //--------------------------------------------------

  if(
    progress &&
    progress.pdfUrl
  ){

    setTimeout(

      function(){

        try{

          window.open(
            progress.pdfUrl,
            "_blank"
          );

        }catch(err){

          console.log(
            "Automatic PDF opening blocked."
          );

        }

      },

      500

    );

  }

}


//====================================================
// SHOW ERROR
//====================================================

function showError(
  message
){

  generationFailed =
    true;

  generationFinished =
    false;

  stopProgressPolling();
  stopBranchBatchLoop();

  document
    .getElementById("spinner")
    .style.display =
      "none";

  document
    .getElementById("status")
    .innerText =
      "Unable to generate PDF";

  document
    .getElementById("progress")
    .style.width =
      "0%";

  document
    .getElementById("percentage")
    .innerText =
      "Error";

  const errorBox =
    document.getElementById(
      "errorBox"
    );

  errorBox.innerText =
    message ||
    "An unexpected error occurred.";

  errorBox.style.display =
    "block";

  document
    .getElementById("retryButton")
    .style.display =
      "inline-block";

}


//====================================================
// RETRY
//====================================================

function retryGeneration(){

  window.location.reload();

}


//====================================================
// PAGE LOAD
//====================================================

window.addEventListener(

  "load",

  function(){

    initialiseUI();

    startGeneration();

  }

);

</script>

</body>

</html>
